<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BINATSA · Videos</title>
<style>
  /* Videos de BINATSA: manuales de tableros (uno por cliente: MANUAL-<CLIENTE>.mp4) y videos de BINATSA (BINATSA-*.mp4). */
  :root{--bg:#fff;--card:#f4f6f7;--ink:#2b3238;--muted:#5f6b75;--accent:#0e5a78;--line:#dfe4e8;color-scheme:light}
  *{box-sizing:border-box}
  body{font-family:"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  main{max-width:1100px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
  header{border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:8px}
  h1{font-size:1.6rem;font-weight:500;color:var(--accent);margin:0 0 4px}
  h2.seccion{font-size:1.05rem;font-weight:600;color:#fff;background:var(--accent);padding:8px 12px;margin:24px 0 12px}
  .sub{color:var(--muted);margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;list-style:none;margin:0;padding:0}
  .card{display:flex;flex-direction:column;width:100%;padding:0;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;text-align:left;cursor:pointer;overflow:hidden;transition:transform .15s,box-shadow .15s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12);outline:none}
  .card:focus-visible{border-color:var(--accent)}
  .thumb{aspect-ratio:1600/560;width:100%;background:#0d1117 center/cover no-repeat;display:grid;place-items:center}
  .thumb span{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .thumb.con-portada{place-items:end end}.thumb.con-portada span{margin:8px}
  .thumb span::before{content:"";margin-left:4px;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent #1d2330}
  .name{padding:12px 14px;font-weight:600}
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);place-items:center;z-index:10;padding:16px}
  #modal.open{display:grid}
  #box{position:relative;width:min(92vw,960px)}
  #box h2{color:#fff;font-size:1rem;font-weight:600;margin:0 40px 10px 0}
  video{width:100%;max-height:80vh;border-radius:8px;background:#000;display:block}
  #close{position:absolute;top:-6px;right:0;background:none;border:0;color:#fff;font-size:2rem;line-height:1;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <header><h1>BINATSA · Videos</h1><p class="sub">Toca un video para verlo.</p></header>
  <h2 class="seccion">Manuales de uso de los tableros</h2>
  <ul class="grid" id="list"></ul>
  <h2 class="seccion">BINATSA</h2>
  <ul class="grid" id="list-binatsa"></ul>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div id="box">
    <h2 id="vtitle"></h2>
    <button id="close" aria-label="Cerrar">&times;</button>
    <video id="player" controls playsinline preload="none"></video>
  </div>
</div>

<script>
  // Para agregar un manual: súmalo aquí. "id" es el nombre corto del enlace directo
  // (por ejemplo index.html?v=tiktok abre y reproduce ese manual).
  // Formato de nombres: manuales MANUAL-<CLIENTE>.mp4 con portada portadas/MANUAL-<CLIENTE>.png;
  // videos de la marca BINATSA-<TEMA>.mp4 (tipo: 'binatsa'). Una línea por video.
  const MANUALES = [
    { id: 'gmf', nombre: 'GMF', video: 'MANUALES-DE-USO/MANUAL-GMF.mp4', portada: 'portadas/MANUAL-GMF.png' },
    { id: 'inter', nombre: 'Inter', video: 'MANUALES-DE-USO/MANUAL-INTER.mp4', portada: 'portadas/MANUAL-INTER.png' },
    { id: 'tiktok', nombre: 'TikTok', video: 'MANUALES-DE-USO/MANUAL-TIKTOK.mp4', portada: 'portadas/MANUAL-TIKTOK.png' },
    { id: 'cobranza', nombre: 'Cobranza unificado', video: 'MANUALES-DE-USO/MANUAL-COBRANZA.mp4', portada: 'portadas/MANUAL-COBRANZA.png' },
    { id: 'total-play', nombre: 'Total Play', video: 'MANUALES-DE-USO/MANUAL-TOTAL-PLAY.mp4', portada: 'portadas/MANUAL-TOTAL-PLAY.png' },
    { id: 'binatsa', nombre: 'BINATSA', video: 'MANUALES-DE-USO/BINATSA.mp4', portada: 'portadas/BINATSA.png', tipo: 'binatsa' },
    { id: 'binatsa-conoce-al-equipo', nombre: 'Conoce al equipo', video: 'MANUALES-DE-USO/BINATSA-CONOCE-AL-EQUIPO.mp4', portada: 'portadas/BINATSA-CONOCE-AL-EQUIPO.png', tipo: 'binatsa' },
  ];

  const list = document.getElementById('list'), listB = document.getElementById('list-binatsa');
  const modal = document.getElementById('modal');
  const player = document.getElementById('player');
  const title = document.getElementById('vtitle');
  let lastFocus = null;

  for (const m of MANUALES) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'card';
    b.type = 'button';
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (m.portada) { thumb.style.backgroundImage = 'url("' + encodeURI(m.portada) + '")'; thumb.classList.add('con-portada'); }
    thumb.innerHTML = '<span aria-hidden="true"></span>';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = m.nombre;
    b.append(thumb, name);
    b.setAttribute('aria-label', (m.tipo === 'binatsa' ? 'Ver video ' : 'Ver manual ') + m.nombre);
    b.onclick = () => open(m);
    li.append(b);
    (m.tipo === 'binatsa' ? listB : list).append(li);
  }

  function open(m) {
    lastFocus = document.activeElement;
    title.textContent = (m.tipo === 'binatsa' ? 'BINATSA · ' : 'Manual ') + m.nombre;
    player.src = encodeURI(m.video);
    modal.classList.add('open');
    document.getElementById('close').focus();
    // Si el navegador bloquea el audio al reproducir solo, arranca en silencio.
    player.play().catch(() => { player.muted = true; player.play().catch(() => {}); });
  }
  function close() {
    player.pause();
    player.removeAttribute('src');
    player.load();
    player.muted = false;
    modal.classList.remove('open');
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById('close').onclick = close;
  modal.onclick = (e) => { if (e.target === modal) close(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) close(); });

  // Enlace directo: ?v=tiktok (o #tiktok) abre ese manual al cargar.
  const pedido = (new URLSearchParams(location.search).get('v') || location.hash.slice(1)).toLowerCase();
  const inicial = MANUALES.find((m) => m.id === pedido);
  if (inicial) window.addEventListener('load', () => open(inicial));
</script>
</body>
</html>
